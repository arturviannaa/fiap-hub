name: fiap-hub

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_DB: fiap
      POSTGRES_USER: fiap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fiap -d fiap']
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: runner
      args:
        REPO_CONTEUDO: ${REPO_CONTEUDO:-https://github.com/mariacmartins/computational_thinking_with_python}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: America/Sao_Paulo
      DATABASE_URL: postgres://fiap:${POSTGRES_PASSWORD}@postgres:5432/fiap
      AUTH_URL: ${AUTH_URL}
      AUTH_SECRET: ${AUTH_SECRET:?defina AUTH_SECRET no .env}
      AUTH_TRUST_HOST: 'true'
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-fiap.com.br,alunos.fiap.com.br}
      CODIGO_TURMA: ${CODIGO_TURMA:?defina CODIGO_TURMA no .env}
      CONTENT_DIR: /app/content
      UPLOAD_DIR: /app/uploads
      FIREBASE_CRED_PATH: /app/secrets/firebase.json
      INTERNO_SECRET: ${INTERNO_SECRET:-}
    volumes:
      # rw porque o entrypoint semeia o conteudo inicial num volume vazio
      - conteudo:/app/content
      - uploads:/app/uploads
      - ./secrets:/app/secrets:ro
    ports:
      - '127.0.0.1:8082:3000'

  # Traz aulas novas do repo da professora sem ninguem precisar fazer deploy.
  sync:
    build:
      context: .
      target: sync
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      REPO_CONTEUDO: ${REPO_CONTEUDO:-https://github.com/mariacmartins/computational_thinking_with_python}
      INTERVALO_SYNC: ${INTERVALO_SYNC:-1800}
      INTERNO_SECRET: ${INTERNO_SECRET:-}
      APP_INTERNO_URL: http://app:3000
    volumes:
      - conteudo:/app/content
      - repos-disciplinas:/app/repos

volumes:
  dados-postgres:
  conteudo:
  uploads:
  repos-disciplinas:
